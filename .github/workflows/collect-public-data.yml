name: Collect public civic data

on:
  workflow_dispatch:
  schedule:
    # Runs hourly at minute 17; timestamps are recorded in America/Bahia by the collector.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: pulso-public-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install --upgrade requests
      - name: Collect public sources
        run: python scripts/collect_public_data.py
      - name: Upload raw snapshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulso-civico-public-data-${{ github.run_id }}
          path: data-collection/
          if-no-files-found: warn
          retention-days: 30
