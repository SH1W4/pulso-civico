name: Test public-data collector

on:
  pull_request:
    paths:
      - "scripts/collect_public_data.py"
      - "tests/**"
      - ".github/workflows/test-public-data-collector.yml"
  push:
    branches: [main]
    paths:
      - "scripts/collect_public_data.py"
      - "tests/**"
      - ".github/workflows/test-public-data-collector.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
